name: Bootstrap validated v0.6.0 source
on:
  push:
    paths:
      - ".bootstrap/READY"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and extract release source
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/skylinee-source.tar.xz
          echo '32307518903d44849b831a709f5cb2b201685170cbd9b8b7a738086d6e097220  /tmp/skylinee-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/skylinee-source.tar.xz
      - name: Test imported source on GitHub runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' ruff
          ruff check --select E4,E7,E9,F,I .
          python -m pytest -q
          python -m compileall -q src/skylinee_harness
          node --check src/skylinee_harness/static/app.js
          python scripts/smoke_http.py
      - name: Commit validated source to main
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add README.md CHANGELOG.md Dockerfile docker-compose.yml pyproject.toml start.sh .env.example .dockerignore .gitignore docs examples scripts src tests
          git commit -m 'Import validated Skylinee Agent Harness v0.6.0 source'
          git push origin HEAD:main
